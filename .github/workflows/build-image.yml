name: Build and publish benchmark runner image

on:
  push:
    branches:
      - feat/constrained-kube-benchmark
    paths:
      - .dockerignore
      - bench/**
      - controls/**
      - docker/**
      - fixtures/**
      - pyproject.toml
      - scripts/**
      - tasks/**
      - tests/**
      - uv.lock
      - verifiers/**
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable human-readable image tag
        required: true
        default: runner-v1
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loop-bench-runner" >> "$GITHUB_OUTPUT"
          echo "tag=${IMAGE_TAG:-runner-${GITHUB_SHA}}" >> "$GITHUB_OUTPUT"

      - name: Cache pinned Loop binary build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: loop-build
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=loop-build
          cache-to: type=gha,scope=loop-build,mode=max
          build-args: |
            LOOP_COMMIT=1dc7ef4a96b19e450d33629035341f0725b38f81

      - name: Build and push linux/amd64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: |
            type=gha,scope=loop-build
            type=gha,scope=runner-image
          cache-to: type=gha,scope=runner-image,mode=max
          build-args: |
            LOOP_COMMIT=1dc7ef4a96b19e450d33629035341f0725b38f81

      - name: Smoke test final image as the agent user
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
        run: |
          docker pull "$IMAGE"
          docker run --rm --user 10001 --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /work:uid=10001,gid=10001,mode=0700 --tmpfs /tmp \
            -e HOME=/work -e TMPDIR=/tmp --entrypoint sh "$IMAGE" -ec '
              for cmd in loop cargo rustc node npm python python3 pi goose opencode hermes cline kilo omp kubectl; do command -v "$cmd" >/dev/null; done
              cargo --version
              rustc --version
              node --version
              python --version
              # Some CLIs (e.g. Pi) print their version on stderr: capture both streams.
              loop --version 2>&1 | grep -F "0.6.0"
              pi --version 2>&1 | grep -F "0.73.1"
              goose --version 2>&1 | grep -F "1.57.0"
              opencode --version 2>&1 | grep -F "1.19.5"
              opencode --help >/dev/null 2>&1
              hermes --version 2>&1 | grep -F "0.22.7"
              cline --version 2>&1 | grep -F "3.0.74"
              kilo --version 2>&1 | grep -F "7.8.18"
              omp --version 2>&1 | grep -F "18.16.0"
              "$DSH_PYTHON" -c "import deepseek_harness"
              ls "$PLAYWRIGHT_BROWSERS_PATH" | grep -q chromium
              kubectl version --client --output=yaml | grep -F "gitVersion: v1.30.14"
              mkdir /work/write-check && touch /work/write-check/ok
              test ! -r /opt/bench/controls/run_controls.py
              test ! -r /opt/bench/bench/verification.py
              test ! -r /opt/bench/verifiers/mini_web_ui.test.js
              test ! -r /opt/bench/fixtures/mini-calc-buggy/src/lib.rs
            '

      - name: Report immutable image reference
        run: echo "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}@${{ steps.build.outputs.digest }}"
