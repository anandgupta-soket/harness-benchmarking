name: Build and publish benchmark runner image

on:
  push:
    branches:
      - feat/constrained-kube-benchmark
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable human-readable image tag
        required: true
        default: runner-v1
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loop-bench-runner" >> "$GITHUB_OUTPUT"
          echo "tag=${IMAGE_TAG:-runner-${GITHUB_SHA}}" >> "$GITHUB_OUTPUT"

      - name: Build and push linux/amd64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          build-args: |
            LOOP_COMMIT=1dc7ef4a96b19e450d33629035341f0725b38f81

      - name: Report immutable image reference
        run: echo "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}@${{ steps.build.outputs.digest }}"
