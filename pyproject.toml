[project]
name = "loop-bench"
version = "0.1.0"
description = "Constrained-resource Kubernetes benchmark runner for coding-agent harnesses"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "playwright>=1.49"]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
