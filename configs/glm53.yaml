# Example experiment config: GLM-5.3 through an OpenAI-compatible endpoint.
# Anything marked UNRESOLVED must be replaced with a concrete value before
# `bench setup|run|qualify` will proceed (they fail closed). `bench plan` works
# regardless and lists what is still unresolved.
#
# NO SECRETS HERE. The API key is read from an existing Kubernetes Secret
# (model.api_key_secret) and injected only into trial pods as the env var
# named by model.api_key_env.
experiment:
  name: glm53-constrained-v1
  seed: 20261105
  repetitions: 5
  memory_mib: [256, 512, 1024, 2048]
  cpu: 1
  max_concurrent_trials: 4
  # 2048 MiB is only a *reference candidate*: it is NOT proven to be unconstrained
  # (see docs/kube-benchmark.md, "Reference profile"). Reports flag it as such.
  reference_memory_mib: 2048

kube:
  access: ssh                    # ssh | local-kubectl
  ssh_host: kube.dev.soket.ai
  namespace: bench-constrained
  context: null
  worker_node: soketlab-worker001 # node hosting the local-path PV; pods are pinned to it

storage:
  pvc_name: bench-data
  size: 20Gi
  storage_class: local-path
  min_free_fraction: 0.20        # dispatch stops when free space on the PVC falls below 20%

model:
  base_url: http://172.17.99.145:30000/v1 # internal route returned one HTTP 200 GLM-5.3 response on 2026-11-05
  name: GLM-5.3
  provider_id: custom-test-soket        # provider id used inside each harness's config
  api_key_env: BENCH_API_KEY            # env var NAME inside the trial pod
  api_key_secret:                       # existing Secret in the namespace; value never leaves the cluster
    name: bench-internal-api-key
    key: api-key

images:
  runner: UNRESOLVED             # e.g. ghcr.io/<org>/loop-bench-runner:<tag>@sha256:... (built by .github/workflows/build-image.yml)

loop:
  repo: soketlabs/loop
  commit: 1dc7ef4a96b19e450d33629035341f0725b38f81   # staging branch commit

# Exact versions are baked into the image at build time (docker/Dockerfile reads these).
# Pin the real released versions; "latest"/branch names are rejected.
harnesses:
  loop:             {version: "0.6.0", source: "git soketlabs/loop @ loop.commit"}
  pi:               {version: "0.73.1", package: "npm @mariozechner/pi-coding-agent"}
  goose:            {version: "1.57.0", package: "github release aaif-goose/goose"}
  opencode:         {version: "1.19.5", package: "npm opencode-ai"}
  hermes:           {version: "0.22.7", package: "git source tag NousResearch/hermes-agent"}
  cline:            {version: "3.0.74", package: "npm cline"}
  kilo:             {version: "7.8.18", package: "npm @kilocode/cli"}
  omp:              {version: "18.16.0", package: "npm (needs bun) can1357/oh-my-pi"}
  deepseek-harness: {version: "0.2.1rc2", package: "pip deepseek-harness-sdk"}

# Token / turn ceilings from the task YAML are NOT enforced by the runner or (generally)
# by the harness CLIs. They are disclosed as such in every report; only the wall-clock
# timeout is enforced (kill of the whole process tree).
limits_disclosure:
  token_ceiling: not-enforced
  turn_ceiling: not-enforced

# Unscored qualification must exercise every scored harness; config validation
# rejects a qualification matrix that omits any of them.
qualification:
  protocol: {task: BUG-01, profile_mib: 2048}
  matrix:
    harnesses: [loop, pi, goose, opencode, hermes, cline, kilo, omp, deepseek-harness]
    tasks: [BUG-01, FEAT-02, WEB-BUG-01]
    profiles: [512, 2048]
    repetitions: 1
